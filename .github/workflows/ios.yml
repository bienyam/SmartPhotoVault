name: iOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new push to a pull request replaces its older run instead of queueing behind it.
concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  package-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check iPhone package validator
        run: python3 -m unittest discover -s Scripts/tests -v
  simulator:
    runs-on: macos-15
    # 1.0.1 added UI tests for the new home, More tab, Checkup and preview; the job needs longer.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          # Starts while the app builds. Left to the test command, a cold start took nearly 8 minutes.
          xcrun simctl boot "$DEVICE_ID" || true
      - name: Build app and tests
        run: >-
          xcodebuild build-for-testing
          -project SmartPhotoVault.xcodeproj
          -scheme SmartPhotoVault
          -derivedDataPath build/DerivedData
          -parallel-testing-enabled NO
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          CODE_SIGNING_ALLOWED=NO
      - name: Prepare simulator Photos integration tests
        timeout-minutes: 6
        run: |
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/SmartPhotoVault.app
      - name: Test archive copy and restore without Photos authorization
        # The first launch of the test host on a fresh simulator has taken up to 5 minutes on its own.
        timeout-minutes: 10
        run: >-
          xcodebuild test-without-building
          -project SmartPhotoVault.xcodeproj
          -scheme SmartPhotoVault
          -derivedDataPath build/DerivedData
          -parallel-testing-enabled NO
          -only-testing:SmartPhotoVaultTests/VerifiedArchiveTests
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          -resultBundlePath build/ArchiveResults.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Authorize Photos through the real system dialog
        # The first launch of the test host on a fresh simulator has taken up to 5 minutes on its own.
        timeout-minutes: 10
        run: >-
          xcodebuild test-without-building
          -project SmartPhotoVault.xcodeproj
          -scheme SmartPhotoVault
          -derivedDataPath build/DerivedData
          -parallel-testing-enabled NO
          -only-testing:SmartPhotoVaultUITests/DashboardUITests/testPrepareFullPhotoAccess
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          -resultBundlePath build/AuthorizationResults.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Test real Photos resources and app flows
        timeout-minutes: 30
        run: >-
          xcodebuild test-without-building
          -project SmartPhotoVault.xcodeproj
          -scheme SmartPhotoVault
          -derivedDataPath build/DerivedData
          -parallel-testing-enabled NO
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 90
          -maximum-test-execution-time-allowance 120
          -skip-testing:SmartPhotoVaultUITests/DashboardUITests/testPrepareFullPhotoAccess
          -skip-testing:SmartPhotoVaultTests/VerifiedArchiveTests
          -skip-testing:SmartPhotoVaultUITests/CrawlerUITests
          -skip-testing:SmartPhotoVaultUITests/StoreScreenshotsUITests
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          -resultBundlePath build/TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Capture dashboard preview
        if: success() || failure()
        run: |
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/SmartPhotoVault.app
          xcrun simctl launch "$DEVICE_ID" com.bienyam.SmartPhotoVault --demo
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot build/dashboard.png
      - name: Save dashboard preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: build/dashboard.png
          if-no-files-found: ignore

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-results
          path: build/*Results.xcresult
          if-no-files-found: ignore
      - name: Export test screenshots
        if: always()
        run: |
          for result in build/*Results.xcresult; do
            if [ -d "$result" ]; then
              name=$(basename "$result" .xcresult)
              xcrun xcresulttool export attachments --path "$result" --output-path "build/test-attachments/$name"
            fi
          done
      - name: Save test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: build/test-attachments
          if-no-files-found: ignore

  ui-crawl:
    # The pull request already crawled exactly what lands on main.
    if: github.event_name != 'push'
    runs-on: macos-15
    # 1.0.1 added screens (Storage Checkup, the new More tab, preview), so the crawl has more to cover.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          # Starts while the app builds. Left to the test command, a cold start took nearly 8 minutes.
          xcrun simctl boot "$DEVICE_ID" || true
      - name: Build app and tests
        run: >-
          xcodebuild build-for-testing
          -project SmartPhotoVault.xcodeproj
          -scheme SmartPhotoVault
          -derivedDataPath build/DerivedData
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          CODE_SIGNING_ALLOWED=NO
      - name: Wait for the simulator
        run: xcrun simctl bootstatus "$DEVICE_ID" -b
      - name: Crawl every screen and button
        timeout-minutes: 45
        # bash turns on pipefail; without it the pipe into tee hid a failed crawl behind a green check.
        shell: bash
        run: >-
          xcodebuild test-without-building
          -project SmartPhotoVault.xcodeproj
          -scheme SmartPhotoVault
          -derivedDataPath build/DerivedData
          -parallel-testing-enabled NO
          -only-testing:SmartPhotoVaultUITests/CrawlerUITests
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          -resultBundlePath build/CrawlResults.xcresult
          CODE_SIGNING_ALLOWED=NO | tee build/crawl.log
      - name: Extract crawl report
        if: always()
        run: |
          grep -h '^CRAWL|' build/crawl.log | sort -u > build/ui-crawl-report.txt || true
          wc -l build/ui-crawl-report.txt || true
          xcrun xcresulttool export attachments --path build/CrawlResults.xcresult --output-path build/crawl-attachments || true
      - name: Save crawl report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-crawl-report
          path: |
            build/ui-crawl-report.txt
            build/crawl-attachments
          if-no-files-found: ignore

  iphone-package:
    needs: [package-checks, simulator]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned iPhone app
        run: >-
          xcodebuild build
          -project SmartPhotoVault.xcodeproj
          -scheme SmartPhotoVault
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/Device
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
      - name: Package and verify iPhone build
        run: |
          mkdir -p build/Package/Payload
          ditto build/Device/Build/Products/Release-iphoneos/SmartPhotoVault.app build/Package/Payload/SmartPhotoVault.app
          cd build/Package
          zip -qry ../SmartPhotoVault-unsigned.ipa Payload
          cd ../..
          python3 Scripts/verify_device_ipa.py build/SmartPhotoVault-unsigned.ipa > build/iphone-package-info.json
          cp WINDOWS_IPHONE_TESTING.md build/WINDOWS_IPHONE_TESTING.md
          cat build/iphone-package-info.json
      - name: Save unsigned iPhone package
        uses: actions/upload-artifact@v4
        with:
          name: iphone-unsigned
          path: |
            build/SmartPhotoVault-unsigned.ipa
            build/iphone-package-info.json
            build/WINDOWS_IPHONE_TESTING.md

