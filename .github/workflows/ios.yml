name: iOS build and tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check iPhone package validator
        run: python3 -m unittest discover -s Scripts/tests -v
  simulator:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select available iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Build app and tests
        run: >-
          xcodebuild build-for-testing
          -project SmartPhotoVault.xcodeproj
          -scheme SmartPhotoVault
          -derivedDataPath build/DerivedData
          -parallel-testing-enabled NO
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          CODE_SIGNING_ALLOWED=NO
      - name: Prepare simulator Photos integration tests
        run: |
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/SmartPhotoVault.app
          xcrun simctl privacy "$DEVICE_ID" grant photos-add com.bienyam.SmartPhotoVault
          xcrun simctl privacy "$DEVICE_ID" grant photos com.bienyam.SmartPhotoVault
      - name: Test real Photos resources and app flows
        run: >-
          xcodebuild test-without-building
          -project SmartPhotoVault.xcodeproj
          -scheme SmartPhotoVault
          -derivedDataPath build/DerivedData
          -parallel-testing-enabled NO
          -test-timeouts-enabled YES
          -default-test-execution-time-allowance 90
          -maximum-test-execution-time-allowance 120
          -destination "platform=iOS Simulator,id=$DEVICE_ID"
          -resultBundlePath build/TestResults.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Capture dashboard preview
        if: success() || failure()
        run: |
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" build/DerivedData/Build/Products/Debug-iphonesimulator/SmartPhotoVault.app
          xcrun simctl launch "$DEVICE_ID" com.bienyam.SmartPhotoVault --demo
          sleep 3
          xcrun simctl io "$DEVICE_ID" screenshot build/dashboard.png
      - name: Save dashboard preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-preview
          path: build/dashboard.png
          if-no-files-found: ignore

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-results
          path: build/TestResults.xcresult
          if-no-files-found: ignore
      - name: Export test screenshots
        if: always()
        run: |
          if [ -d build/TestResults.xcresult ]; then
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/test-attachments
          fi
      - name: Save test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: build/test-attachments
          if-no-files-found: ignore

  iphone-package:
    needs: [package-checks, simulator]
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned iPhone app
        run: >-
          xcodebuild build
          -project SmartPhotoVault.xcodeproj
          -scheme SmartPhotoVault
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath build/Device
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
      - name: Package and verify iPhone build
        run: |
          mkdir -p build/Package/Payload
          ditto build/Device/Build/Products/Release-iphoneos/SmartPhotoVault.app build/Package/Payload/SmartPhotoVault.app
          cd build/Package
          zip -qry ../SmartPhotoVault-unsigned.ipa Payload
          cd ../..
          python3 Scripts/verify_device_ipa.py build/SmartPhotoVault-unsigned.ipa > build/iphone-package-info.json
          cp WINDOWS_IPHONE_TESTING.md build/WINDOWS_IPHONE_TESTING.md
          cat build/iphone-package-info.json
      - name: Save unsigned iPhone package
        uses: actions/upload-artifact@v4
        with:
          name: iphone-unsigned
          path: |
            build/SmartPhotoVault-unsigned.ipa
            build/iphone-package-info.json
            build/WINDOWS_IPHONE_TESTING.md

