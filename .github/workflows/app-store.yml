name: App Store Connect upload

on:
  pull_request:
    paths:
      - '.github/workflows/app-store.yml'
      - 'project.yml'
      - 'Sources/**'
  workflow_dispatch:
    inputs:
      upload:
        description: Sign and upload to App Store Connect
        type: boolean
        default: false
      review_build:
        description: Build for App Review (tester access off, build number ends in .9)
        type: boolean
        default: false

permissions:
  contents: read

# A new push to a pull request replaces its older run. Uploads are never cancelled.
concurrency:
  group: app-store-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  screenshots:
    # Store pictures only, so on request rather than on every push: it held a runner for 8 to 17 minutes.
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.upload }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture App Store pictures on iPhone and iPad
        run: |
          brew install xcodegen
          xcodegen generate
          mkdir -p build/store-screenshots
          devices="$(xcrun simctl list devices available -j)"
          capture() {
            local name_pattern="$1" label="$2" device_id
            device_id="$(python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          for runtime in sorted(devices, reverse=True):
              for device in devices[runtime]:
                  if re.fullmatch(sys.argv[1], device["name"]):
                      print(device["udid"])
                      sys.exit()
          sys.exit("No matching simulator: " + sys.argv[1])
          ' "$name_pattern" <<< "$devices")"
            xcrun simctl bootstatus "$device_id" -b
            xcrun simctl status_bar "$device_id" override --time '9:41'               --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState discharging --batteryLevel 100
            xcodebuild test -project SmartPhotoVault.xcodeproj -scheme SmartPhotoVault               -destination "platform=iOS Simulator,id=$device_id"               -only-testing:SmartPhotoVaultUITests/StoreScreenshotsUITests               -resultBundlePath "build/Store-$label.xcresult" CODE_SIGNING_ALLOWED=NO
            xcrun xcresulttool export attachments --path "build/Store-$label.xcresult" --output-path "build/attachments-$label"
            python3 - "build/attachments-$label" "$label" <<'PY'
          import json, pathlib, shutil, sys
          folder, label = pathlib.Path(sys.argv[1]), sys.argv[2]
          for test in json.loads((folder / "manifest.json").read_text()):
              for item in test.get("attachments", []):
                  name = item.get("suggestedHumanReadableName", "")
                  if name.startswith("store-"):
                      shutil.copy(folder / item["exportedFileName"], f"build/store-screenshots/{label}-{name.split('_')[0]}.png")
          PY
            xcrun simctl shutdown "$device_id"
          }
          capture 'iPhone (16|17|18) Pro Max' iPhone
          capture 'iPad (Pro|Air) 13-inch.*' iPad
          ls build/store-screenshots
          sips -g pixelWidth -g pixelHeight build/store-screenshots/*.png
      - uses: actions/upload-artifact@v4
        with:
          name: app-store-screenshots
          path: build/store-screenshots
          if-no-files-found: error

  release:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      BUILD_NUMBER: ${{ github.run_number }}.${{ github.run_attempt }}${{ inputs.review_build && '.9' || '' }}
      # TestFlight builds unlock Pro for testers; App Review builds must not.
      TESTER_FLAG: ${{ !inputs.review_build && 'TESTER_ACCESS' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate project
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          if [[ "${sdk_version%%.*}" != "27" ]]; then
            echo "::error::Expected the iOS 27 SDK, found $sdk_version"
            exit 1
          fi
          echo "iPhoneOS SDK: $sdk_version"
          brew install xcodegen
          xcodegen generate
      - name: Build unsigned release archive
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive -project SmartPhotoVault.xcodeproj -scheme SmartPhotoVault \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath build/SmartPhotoVault.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS="$TESTER_FLAG" \
            CODE_SIGNING_ALLOWED=NO
          echo "Build $BUILD_NUMBER, tester access: ${TESTER_FLAG:-off (App Review build)}"
      - name: Verify archive SDK
        run: |
          plist=build/SmartPhotoVault.xcarchive/Products/Applications/SmartPhotoVault.app/Info.plist
          sdk="$(/usr/libexec/PlistBuddy -c 'Print :DTSDKName' "$plist")"
          minimum="$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$plist")"
          echo "Archive SDK: $sdk; minimum iOS: $minimum"
          if [[ "$sdk" != iphoneos27.* || "$minimum" != "17.0" ]]; then
            echo "::error::Expected iOS 27 SDK and iOS 17.0 deployment target"
            exit 1
          fi
      - name: Sign and upload release archive
        if: ${{ inputs.upload && github.ref == 'refs/heads/main' }}
        env:
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          : "${APPLE_TEAM_ID:?Set the APPLE_TEAM_ID repository variable}"
          : "${ASC_ISSUER_ID:?Set the ASC_ISSUER_ID repository variable}"
          : "${ASC_KEY_ID:?Set the ASC_KEY_ID repository variable}"
          : "${ASC_PRIVATE_KEY:?Set the ASC_PRIVATE_KEY repository secret}"
          umask 077
          key_path="$(mktemp "$RUNNER_TEMP/asc-key.XXXXXX")"
          trap 'rm -f "$key_path"' EXIT
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key_path"
          unset ASC_PRIVATE_KEY
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key_path"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          options=build/AppStoreExport.plist
          plutil -create xml1 "$options"
          plutil -insert method -string app-store-connect "$options"
          plutil -insert destination -string upload "$options"
          plutil -insert signingStyle -string automatic "$options"
          plutil -insert teamID -string "$APPLE_TEAM_ID" "$options"
          plutil -insert manageAppVersionAndBuildNumber -bool NO "$options"
          xcodebuild -exportArchive -archivePath build/SmartPhotoVault.xcarchive \
            -exportOptionsPlist "$options" -exportPath build/AppStoreExport "${auth[@]}"
      - name: Reject upload requests outside main
        if: ${{ inputs.upload && github.ref != 'refs/heads/main' }}
        run: exit 1
