name: SmartPhotoVault
options:
  bundleIdPrefix: com.bienyam
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  SmartPhotoVault:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: TidyAway
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        'UISupportedInterfaceOrientations~ipad':
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCalendarsFullAccessUsageDescription: If you turn on reminders before big events, TidyAway reads your calendar on this device to spot trips and events like weddings and birthdays in the next two weeks, so it can remind you to make room for photos. Nothing from your calendar is saved or sent anywhere.
        UIBackgroundModes:
          - fetch
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - com.bienyam.SmartPhotoVault.checkin.refresh
          - com.bienyam.SmartPhotoVault.checkin.recount
        NSPhotoLibraryUsageDescription: TidyAway reads your photo library to find what is taking space, group photos by what they show (on your iPhone), copy the ones you choose to your archive, and put archived ones back. It deletes items only when you approve and confirm the prompt from Apple Photos.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        GENERATE_INFOPLIST_FILE: NO
  SmartPhotoVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SmartPhotoVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  SmartPhotoVaultUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: SmartPhotoVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SmartPhotoVault:
    build:
      targets:
        SmartPhotoVault: all
    test:
      targets: [SmartPhotoVaultTests, SmartPhotoVaultUITests]

