name: SmartPhotoVault
options:
  bundleIdPrefix: com.bienyam
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
targets:
  SmartPhotoVault:
    type: application
    platform: iOS
    sources: [Sources]
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: SmartPhotoVault
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: SmartPhotoVault reads your photo library to inventory photos and videos. This version never changes or deletes photos.
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
  SmartPhotoVaultTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: SmartPhotoVault
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SmartPhotoVault:
    build:
      targets:
        SmartPhotoVault: all
    test:
      targets: [SmartPhotoVaultTests]

